<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DTS Tracker – Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --navy:#0E2A47;--navy2:#16385d;--blue:#1456A0;--blue-soft:#e6eef8;--maroon:#9B1C31;
 --bg:#F2F4F7;--surface:#fff;--ink:#101828;--muted:#667085;--line:#e2e6ec;--line2:#eef0f4;
 --hr:#1456A0;--pay:#0f8a6a;--oth:#b7791f;
 --r:8px;
}
@media (prefers-color-scheme:dark){:root{--bg:#0a121c;--surface:#101b29;--ink:#eef2f7;--muted:#93a0b2;--line:#1f2d3f;--line2:#16222f;--blue-soft:#12263f;--blue:#5b9bea}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 "Public Sans",system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-feature-settings:"tnum"}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:12.5px}
.muted{color:var(--muted)}

/* demo bar */
.demo{background:#fff8e1;color:#5c4400;padding:7px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;border-bottom:1px solid #f0d98a}
.demo select{background:#fff;color:#111;border:1px solid #d9c27a;border-radius:6px;padding:3px 8px}
.demo b{background:#5c4400;color:#fff8e1;padding:1px 7px;border-radius:4px}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 38px)}
aside{background:var(--navy);color:#cfd9e6;padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 38px)}
.logo{display:flex;gap:10px;align-items:center;padding:2px 8px 18px}
.mark{width:34px;height:34px;border-radius:8px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:-.02em}
.logo b{display:block;color:#fff;font-size:15px;line-height:1.1}.logo span{font-size:12px;color:#8ea6c2}
.nav{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border:0;background:none;color:#b9c8da;border-radius:7px;cursor:pointer;text-align:left}
.nav svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.grp{font-size:12px;color:#7e97b5;margin:18px 10px 6px}
.sys{border-top:1px solid rgba(255,255,255,.12);margin-top:14px;padding-top:2px}
.who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px 2px;border-top:1px solid rgba(255,255,255,.12)}
.av{width:34px;height:34px;border-radius:50%;background:#2b4f7a;color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex-shrink:0}
.who b{display:block;color:#fff;font-size:13px;line-height:1.2}.who span{font-size:12px;color:#8ea6c2}
.who button{margin-left:auto;background:none;border:0;color:#8ea6c2;cursor:pointer;padding:4px;border-radius:6px}.who button:hover{color:#fff;background:rgba(255,255,255,.08)}

main{padding:26px 32px 48px;min-width:0;max-width:1320px}
.head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:24px;line-height:1.2;margin:0;letter-spacing:-.015em;font-weight:700}
.sub{color:var(--muted);margin:3px 0 0}
.grow{flex:1}

/* controls */
.btn{height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.p{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.p:hover{filter:brightness(1.08)}
.btn.d{color:var(--maroon);border-color:color-mix(in srgb,var(--maroon) 35%,var(--line))}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn svg{width:15px;height:15px}
.input{height:36px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 11px;min-width:0;width:100%}
.input:disabled{background:var(--line2);color:var(--muted)}
textarea.input[readonly]{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 25%,transparent)}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search svg{position:absolute;left:10px;top:10px;width:16px;height:16px;color:var(--muted)}
.search .input{padding-left:33px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:18px}
.strip div{padding:14px 18px;border-right:1px solid var(--line)}.strip div:last-child{border:0}
.strip b{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;display:block}
.strip span{color:var(--muted);font-size:13px}

/* table */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tw{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:880px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:11px 14px;background:color-mix(in srgb,var(--line2) 70%,var(--surface));border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.rec{cursor:pointer}tr.rec:hover td{background:color-mix(in srgb,var(--blue-soft) 55%,var(--surface))}
tr.rec td:first-child{box-shadow:inset 3px 0 0 var(--rail,var(--line))}
.ttl{font-weight:500;max-width:420px}
.by{color:var(--muted);font-size:12.5px;margin-top:1px}
.tag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:12px;padding:2px 8px;border-radius:5px;background:var(--line2);border:1px dashed var(--line);white-space:nowrap}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;display:block;background:currentColor}
.t-hr{color:var(--hr);background:color-mix(in srgb,var(--hr) 12%,transparent)}
.t-pay{color:var(--pay);background:color-mix(in srgb,var(--pay) 13%,transparent)}
.r-user{color:var(--muted);background:var(--line2)}.r-admin{color:var(--blue);background:var(--blue-soft)}.r-super{color:#fff;background:var(--navy)}
.on-ok{color:var(--pay)}.on-off{color:var(--maroon)}.on-warn{color:var(--oth)}
.foot{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}

/* side sheet */
.ov{position:fixed;inset:0;background:rgba(10,18,28,.5);display:none;justify-content:center;align-items:center;padding:16px;z-index:30}
.ov.on{display:flex}
.sheet{background:var(--surface);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:12px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.3);animation:in .16s ease-out}
@keyframes in{from{transform:translateY(10px) scale(.98);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-h{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1;border-radius:12px 12px 0 0}
.sh-h h2{margin:0;font-size:17px}
.x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px}.x:hover{background:var(--line2)}
.sh-b{padding:20px 22px}.sh-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);border-radius:0 0 12px 12px}
.f{margin-bottom:14px}.f label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.route{display:flex;gap:10px;align-items:center;background:var(--blue-soft);border:1px solid color-mix(in srgb,var(--blue) 25%,transparent);color:var(--blue);padding:9px 12px;border-radius:var(--r);font-weight:600}
.route small{font-weight:400;color:var(--muted);margin-left:auto}
.lockrow{display:flex;gap:8px;align-items:center}
.warn{border:1px solid color-mix(in srgb,var(--maroon) 35%,var(--line));background:color-mix(in srgb,var(--maroon) 8%,var(--surface));color:var(--maroon);border-radius:var(--r);padding:11px 13px}

/* routing slip (detail) */
.slip{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.slip-top{padding:16px 18px;background:var(--navy);color:#fff}
.slip-top small{color:#9fb6d2;display:block;margin-bottom:6px}
.slip-top .tag{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff;font-size:14px}
.perf{height:0;border-top:2px dashed var(--line);position:relative;margin:0 -1px}
.perf:before,.perf:after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.perf:before{left:-9px}.perf:after{right:-9px}
.dl{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;padding:16px 18px;margin:0}
.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:500}
.flow{display:flex;align-items:center;gap:10px;padding:0 18px 18px;font-size:13px}
.flow .n{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.flow .n small{display:block;color:var(--muted)}
.flow .ar{color:var(--muted)}

/* logs */
.log{display:grid;grid-template-columns:150px 1fr auto;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line2);align-items:start}
.log:last-child{border:0}
.act{display:inline-flex;gap:7px;align-items:center;font-weight:600;font-size:13px}
.act i{width:9px;height:9px;border-radius:50%;display:block}
.a-create{background:var(--pay)}.a-edit{background:var(--blue)}.a-del{background:var(--maroon)}.a-sys{background:var(--navy)}.a-login{background:#98a2b3}.a-fail{background:var(--maroon);box-shadow:0 0 0 3px color-mix(in srgb,var(--maroon) 25%,transparent)}

/* backup */
.bk{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.bk .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.bk h3{margin:0 0 3px;font-size:15px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);margin:12px 0}

/* login */
.lg{min-height:calc(100vh - 38px);display:grid;grid-template-columns:1.05fr 1fr}
.lg-l{background:var(--navy);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.lg-l h2{font-size:34px;line-height:1.15;letter-spacing:-.02em;margin:0 0 12px;max-width:14ch}
.lg-l p{color:#a9bdd6;max-width:36ch;margin:0}
.lg-l .tag{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3);color:#d6e2f1}
.lg-r{display:grid;place-items:center;padding:32px}
.lg-r form{width:min(360px,100%)}
.lg-r h1{font-size:22px;margin-bottom:4px}

.kebab{width:32px;height:32px;padding:0;justify-content:center;border-color:transparent;background:none;font-size:18px;line-height:1;color:var(--muted)}
.kebab:hover{background:var(--line2);color:var(--ink)}
.menu{position:fixed;z-index:40;min-width:176px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:5px;display:none}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--line2)}
.menu button.d{color:var(--maroon)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:50;font-weight:500}

@media(max-width:900px){
 .app{grid-template-columns:1fr}
 aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px}
 .logo{padding:0 8px 0 4px}.grp,.who,.sys{display:none}
 .nav{width:auto}
 main{padding:18px 14px 40px}
 .strip{grid-template-columns:1fr 1fr}.strip div:nth-child(2){border-right:0}.strip div:nth-child(-n+2){border-bottom:1px solid var(--line)}
 .bk{grid-template-columns:1fr}
 .lg{grid-template-columns:1fr}.lg-l{display:none}
 .log{grid-template-columns:1fr}
}
</style>
</head>

function dRange(f,t){
 if(!f)return "";const a=new Date(f+"T00:00"),b=new Date((t||f)+"T00:00"),M=d=>MON[d.getMonth()],D=d=>d.getDate(),Y=d=>d.getFullYear();

 if(M(a)===M(b))return `${M(a)} ${D(a)}-${D(b)}, ${Y(a)}`;

}
function pSchools(){$("#m").innerHTML=head("Schools","Schools in the district.",`<button class="btn p" onclick="schoolForm()">${ic("plus",15)}Add school</button>`)+tbl(["School","Users","Records"],SCHOOLS.map((s,i)=>`<tr><td><b>${s}</b></td><td>${1+i%2}</td><td>${10+i*7}</td></tr>`).join(""))}
function pTypes(){const q=tq.toUpperCase(),L=ROUTES.filter(x=>!q||x[0].includes(q)||x[1].includes(q));$("#m").innerHTML=head("Document types",`${ROUTES.length} types from the district route list. Set which office each one goes to.`,`<button class="btn p" onclick="typeForm()">${ic("plus",15)}Add type</button>`)+`<div class="toolbar"><div class="search">${ic("search",16)}<input class="input" id="tqi" placeholder="Search document type or office" aria-label="Search" value="${tq}" oninput="tq=this.value;pTypes();const e=$('#tqi');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div><span class="muted">${L.length} shown</span></div>`+tbl(["Document type","Routed to office","Asks for dates?",""],L.map(x=>`<tr><td><b>${x[0]}</b></td><td><span class="pill t-hr">${x[1]}</span></td><td>${LEAVE.has(x[0])?"Yes":"No"}</td><td style="text-align:right">${kebab([["Edit","typeForm()"],["-"],["Delete","toast('Still used by records, so it cannot be deleted')",1]])}</td></tr>`).join(""))}
function pLogs(){
 $("#m").innerHTML=head("Activity logs","Who did what, and when. Only superadmins can see this.",`<button class="btn" onclick="toast('Exported')">${ic("dl",15)}Export</button>`)+
 `<div class="toolbar"><div class="search">${ic("search",16)}<input class="input" placeholder="Search user or action" aria-label="Search"></div><select class="input" style="width:auto"><option>All actions</option><option>Added</option><option>Edited</option><option>Deleted</option><option>Sign-in</option><option>Backup</option></select></div>
 <div class="panel">${LOGS.map(l=>`<div class="log"><span class="mono muted">${l[0]}</span><div><span class="act"><i class="a-${l[2]}"></i>${l[3]}</span><div class="by">${l[1]}${l[4]?" · "+l[4]:""}</div></div></div>`).join("")}</div>`;
}
function pBackup(){
 $("#m").innerHTML=head("Backup & restore","Download a copy of the data, or restore it from an earlier backup.")+
 `<div class="bk"><div class="box"><h3>Create backup</h3><p class="sub">Records, users, schools, and document types. Passwords are not included.</p><div style="margin-top:14px"><button class="btn p" onclick="toast('Backup created')">${ic("dl",15)}Create backup now</button></div></div>
 <div class="box"><h3>Restore from file</h3><p class="sub">Use a backup file saved earlier (e.g. from a laptop or flash drive). Records added after it are kept.</p><div class="drop">Drop a backup file here or <u>choose a file</u></div><button class="btn d" onclick="confirmRestore('uploaded-file.json')">Restore…</button></div></div>`+
 tbl(["Backup","Created","Size",""],BK.map(b=>`<tr><td class="mono">${b[0]}</td><td>${b[1]}</td><td>${b[2]}</td><td style="white-space:nowrap;text-align:right">${kebab([["Download","toast('Downloaded')"],["-"],["Restore","confirmRestore('"+b[0]+"')",1]])}</td></tr>`).join(""));
}
function confirmRestore(f){
 sheet("Restore data?",`<div class="warn">Records in <b class="mono">${f}</b> will be added back, and changed records will go back to how they were in the backup. Records added after the backup are kept. An automatic backup is created first.</div>
 <div class="f" style="margin-top:16px"><label>Type RESTORE to confirm</label><input class="input" placeholder="RESTORE"></div>`,
 `<button class="btn" onclick="closeSheet()">Cancel</button><button class="btn p" style="background:var(--maroon);border-color:var(--maroon)" onclick="closeSheet();toast('Data restored')">Restore data</button>`);
}
render();
</script>
</body>
</html>
